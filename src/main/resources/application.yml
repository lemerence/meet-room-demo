spring:
  application:
    name: meet-room-demo
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  sql:
    init:
      mode: never
  jackson:
    time-zone: Asia/Shanghai

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
